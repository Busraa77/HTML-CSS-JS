<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: yellow;
            height: 150px;
            width:150px;
            color:white;
            font-size:2rem;
            transform-origin: 50% 50%;
            /*transition: color 1s, background-color 3s;*/
            /*transition: 2s cubic-bezier(0,0.86,0.36,1);*/
            /*transition-delay:1s;
            transition-timing-function: ease-out;
            transition-duration: 4s;
            transition-property: color,background-color;
            transition-property: all;*/


        }
        div:hover{
           /* background-color:teal;
            color:black;*/

            /*animation: name duration timing-function delay iteration-count direction fill-mode;*/
            animation: renk-degistir 4s ease-in 1 forwards,
            boyut-degistir 4s 1s 2 both alternate;
            /*direction alternate: animasyon ileri-geri şeklinde gerçekleşir.
            iteration count infinite:sonsuz
            fill-mode: backwards both*/


            /*animation-play-state: paused;  animasyonu oynat üzerine gelince dursun.*/
        }
        div:hover{
            /*transform: translateX(50px);*/
            transform: translate(50px,50%);
            transform:rotate(2turn); 
            /*transform:rotateX(-1turn);*/
            transform:scale(2);
            transform:skew(10deg);
            transition:2s;
        }
        @keyframes renk-degistir{
            from{
                background-color:red;
            }
            50%{
                background-color:yellow;
            }
        to{
            background-color: teal;
        }  
    } 
    @keyframes boyut-degistir{
        to{
            width:200px;
            height:200px;
        }
    }
        </style>
</head>
<body>
    <div>Div</div>
</body>
</html>
