<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Tasarımı</title>

    <style>
        *,*::after, *::before{
            box-sizing:border-box;
        }

        .my-checkbox{
            position:absolute;
            left:-99999px;
            opacity:0;
        }

        .my-checkbox + label{
            cursor:pointer;
            display:flex;
            align-items: center;
            font-size: 20px;
        }

        .my-checkbox + label::before{
            content:' ';
            width:1.5em;
            height:1.5em;
            display:inline-block;
            border-radius: .2em;
            border: .05em solid black;
            margin-right:0.5em
        } 

        .my-checkbox + label:hover::before{
            background-color:#0AF;
        }

        .my-checkbox:focus + label::before{
            box-shadow: 0 0 20px 0 black;
        }
        
        /*check mark html
        \2714: Evrensel Unicode karakter tablosunda ağır onay işaretini (✔ - Heavy Check Mark) temsil eden onaltılık (hex) kodudur.*/
        .my-checkbox:checked +label::before {
            content:'\2714';
            text-align: center;
        }

        .my-checkbox:disabled + label::before{
            background-color: #ccc;
            border-color:#999;
        }
        .my-checkbox:disabled + label{
            color:#aaa;
            cursor:not-allowed;
        }

    </style>
</head>
<body>
    <input class="my-checkbox" type="checkbox" disabled checked id="cb1">
    <label for="cb1">CHECKBOX1</label>
<br>
    <input class="my-checkbox" type="checkbox" disabled id="cb2">
    <label for="cb2">CHECKBOX2</label>
<br>
    <input class="my-checkbox" type="checkbox"id="cb3">
    <label for="cb3">CHECKBOX3</label>
<br>
    <input class="my-checkbox" type="checkbox"id="cb4">
    <label for="cb4">CHECKBOX4</label>
</body>
</html>
